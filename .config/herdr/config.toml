onboarding = false

# worktrunk (`wt`) creates and removes the worktrees; the herdr-worktrunk plugin
# registers the resulting checkout with herdr via `herdr worktree open`
# (the plugin's default open_mode = "workspace").
#
# Why not the native worktree support:
#   herdr's [worktrees].directory is a single global root, and everything under it
#   is fixed to <directory>/<repo>/<branch-slug>. It can express neither the owner
#   level nor nesting on the `/` in a branch name, so this convention cannot be
#   written:
#
#     ~/repos/src/github.com/<owner>/<repo>+worktrees/<branch>
#
#   The request to add placeholders, herdrdev/herdr#261, was closed as NOT_PLANNED
#   on 2026-08-02, so there is no upstream fix in sight.
#
# The SoT for the path convention is worktree-path in ~/.config/worktrunk/config.toml.
# Do not put path rules here.

# Safety net. The sidebar's "New worktree" / "Open worktree..." /
# "Delete worktree checkout..." actions cannot be turned off in config, so send
# accidental use somewhere that does not pollute the ghq tree (~/repos/src).
# The name is deliberately obvious so a stray checkout is recognizable.
[worktrees]
directory = "~/repos/.herdr-stray-worktrees"

# --- herdr-worktrunk plugin actions ---
#
# A [[keys.command]] on the same key takes precedence over the built-in binding.
# prefix+shift+g intentionally replaces herdr's default new_worktree.

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

# The README suggests prefix+shift+r, but that collides with herdr's default
# reload_config, so this uses b instead.
[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "worktrunk.open-with-remotes"
description = "Worktree: switch / create from local or remote branches"

# The README suggests prefix+shift+d, but that collides with herdr's default
# close_workspace, so this uses q instead.
[[keys.command]]
key = "prefix+shift+q"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "worktrunk.merge"
description = "Worktree: merge into the target branch"

[ui]
# Keep the sidebar collapsed by default and switch workspaces through the
# prefix+s picker overlay (the picker is an overlay independent of the sidebar,
# so picking one and returning to the terminal leaves it collapsed).
# Expand with prefix+b only when you want it visible. NOTE: takes effect on next launch.
# sidebar_start_collapsed = true
# "compact" = keep the narrow status rail (an agent's blocked/done stays visible while collapsed)
# "hidden"  = zero width, gone entirely (use this to maximize the terminal)
# sidebar_collapsed_mode = "compact"

# Dracula purple (tmux's active border / status color)
# accent = "#bd93f9"
# mouse_capture = true
# copy_on_select = true
# mouse_scroll_lines = 3
# confirm_close = true
# Create immediately with the generated name
prompt_new_tab_name = false

# agent_panel_sort = "priority"

# The default sidebar width is 26, which cuts Japanese titles off at around
# 13 characters, so widen it.
sidebar_width = 34
sidebar_max_width = 44

# The second row defaults to "agent", but every pane is claude here, so that row
# carries no information. Replace it with the session summary Claude Code writes
# to the terminal title, so the list shows not just "which workspace, which number"
# but what each session is actually doing.
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  [{ token = "terminal_title_stripped", dim = false }],
]
